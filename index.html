                "operatingSystem": "All",
                "offers": {

                    "priceCurrency": "USD"
                },

    <body>
        <div id="app">
            <!-- ADMIN -->
            <section id="admin-view" class="view hidden">
                <header class="md-topbar">
                    <h1 data-i18n="adminTitle">Управление призами</h1>
                    <div class="header-actions">
                        <select id="lang-switcher" class="md-select"><option value="ru">🇷🇺 RU</option><option value="en">🇬🇧 EN</option></select>
                        <button id="to-lottery-btn" class="md-btn md-btn-outlined" data-i18n="toLottery">К лототрону</button>
                    </div>
                </header>
                <div class="admin-controls">
                    <button id="add-item-btn" class="md-btn md-btn-outlined-accent" data-i18n="addPrize">+ Добавить приз</button>
                    <div class="danger-zone">
                        <button id="reset-all-btn" class="md-btn md-btn-outlined-danger" data-i18n="resetAll">Сбросить все в 0</button>
                        <button id="fill-stock-btn" class="md-btn md-btn-outlined-warning" data-i18n="fillStock">Остаток = Количество</button>
                        <button id="fill-demo-btn" class="md-btn md-btn-outlined-warning" data-i18n="fillDemo">Заполнить демо</button>
                    </div>
                </div>
                <div id="items-list" class="items-grid"></div>
            </section>

            <!-- LOTTERY -->
            <section id="lottery-view" class="view hidden">
                <div class="lottery-header">
                    <select id="lang-switcher-main" class="md-select md-select-icon"><option value="ru">🇷🇺 RU</option><option value="en">🇬🇧 EN</option></select>
                </div>
                <div class="hidden-admin-link" id="admin-link-trigger">⚙️</div>

                <!-- HEXAGONAL LOTOTRON WITH INVISIBLE CIRCLE PHYSICS -->
                <div class="machine-wrapper">
                    <svg class="machine-svg" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lottery ball machine">
                    <defs>
                    <radialGradient id="ballYellow" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#fff9c4"/>
                    <stop offset="45%" stop-color="#ffca28"/>
                    <stop offset="100%" stop-color="#f57f17"/>
                    </radialGradient>
                    <radialGradient id="ballBlue" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#b2ebf2"/>
                    <stop offset="45%" stop-color="#00bcd4"/>
                    <stop offset="100%" stop-color="#006064"/>
                    </radialGradient>
                    <linearGradient id="hexFill" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#1a2a35"/>
                    <stop offset="100%" stop-color="#0d1b24"/>
                    </linearGradient>
                    <clipPath id="circleClip">
                        <circle cx="200" cy="200" r="125"/>
                    </clipPath>
                    </defs>

                    <!-- Ножка -->
                    <polygon points="200,355 135,465 265,465" fill="#1a2a35" stroke="#00BCD4" stroke-width="4" stroke-linejoin="round"/>
                    <rect x="115" y="460" width="170" height="20" rx="6" fill="#263238" stroke="#00BCD4" stroke-width="2"/>

                    <!-- Вращающаяся группа: корпус + шарики -->
                    <g id="drum-rotor" style="transform-origin: 200px 200px;">
                    <!-- Шестиугольный корпус -->
                    <polygon points="200,50 330,125 330,275 200,350 70,275 70,125"
                             fill="url(#hexFill)" stroke="#00BCD4" stroke-width="6" stroke-linejoin="round"/>

                    <!-- Шарики (обрезаны по невидимому кругу) -->
                    <g id="balls-container" clip-path="url(#circleClip)"></g>
                    </g>

                    <!-- Выпавший бирюзовый шарик -->
                    <g id="winner-group" opacity="0">
                    <circle cx="200" cy="400" r="24" fill="url(#ballBlue)" stroke="#00BCD4" stroke-width="4"/>
                    <circle cx="200" cy="400" r="10" fill="#006064" stroke="#004D40" stroke-width="2.5"/>
                    </g>
                    </svg>
                </div>

                <button id="spin-btn" class="md-btn md-btn-outlined-accent-lg pulse-btn" data-i18n="spinBtn">КРУТИТЬ БАРАБАН</button>

                <!-- MODAL -->
                <div id="result-modal" class="modal hidden">
                    <div class="modal-content">
                        <h2 data-i18n="congrats">Поздравляем!</h2>
                        <p data-i18n="youWon">Вы выиграли:</p>
                        <h3 id="win-name">Prize Name</h3>
                        <div class="modal-actions">
                            <button id="cancel-win-btn" class="md-btn md-btn-outlined-danger" data-i18n="cancel">Отменить результат</button>
                            <button id="confirm-win-btn" class="md-btn md-btn-outlined-accent" data-i18n="confirm">Подтвердить результат</button>
                        </div>
                    </div>
                </div>
            </section>

            <p>Free offline PWA for hosting guaranteed-win lotteries. Physics-based ball machine, Material Design, works without internet, bilingual.</p>
